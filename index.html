<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Star Spectra Viewer</title>
  <link rel="stylesheet" href="main.css">
</head>

<body>
  <header>
    <h2 id="titleMain" style="margin:.1rem">Star Spectra Viewer - Main Sequence</h2>
  </header>

  <div id="controls" aria-live="polite">
    <label for="spectralSlider">Spectral Type:</label>
    <input type="range" id="spectralSlider" min="0" max="0" step="1" value="0" aria-label="Spectral type slider">
    <span id="sliderLabel">—</span>
    <div id="message" role="status">Initializing…</div>
    <button id="keepLineBtn">Keep Line</button>
    <button id="clearLinesBtn">Clear Lines</button>
  </div>

  <div id="canvas-container">
    <canvas id="spectrumCanvas"></canvas>
    <canvas id="canvasRainbow"></canvas>
  </div>

  <footer>
    Spectral types based on Kesseli et al. (2017),
    <a href="https://arxiv.org/abs/1702.06957">arXiv:1702.06957</a>
    and the SDSS BOSS Spectrograph Empirical Templates
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => init());

    const canvas = document.getElementById('spectrumCanvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('spectralSlider');
    const sliderLabel = document.getElementById('sliderLabel');
    const messageEl = document.getElementById('message');

    const titleMain = document.getElementById('titleMain');

    let currentMode = 'main'; // 'main' or 'giants'
    const SPECTRA_FILES = {
      main: 'spectra.json',
      giants: 'spectra_giants.json'
    };

    // Cache loaded datasets so we only fetch each JSON once
    const spectraCache = {
      main: null,
      giants: null
    };

    let spectraData = {};
    let keys = [];
    let currentKey = null;
    let hoverLineX = null;      // Current hover line X (while moving)
    let hoverLineY = null;      // Current hover line Y (for label placement)
    let persistentLineX = null; // Last clicked/touched line
    let savedLines = [];        // Permanent lines (from "Keep Line")
    const marginBottom = 60;    // px for scale and labels
    const topPadding = 40;
    let plotHeight;

    function setupTitleToggle() {
      if (!titleMain) return;

      titleMain.style.cursor = 'pointer';
      titleMain.title = 'Click to toggle Main Sequence / Red Giants';

      titleMain.addEventListener('click', async () => {
        const nextMode = (currentMode === 'main') ? 'giants' : 'main';

        // Update title text immediately for the Easter egg feel
        titleMain.textContent =
          nextMode === 'main'
            ? 'Star Spectra Viewer - Main Sequence'
            : 'Star Spectra Viewer - Red Giants';

        showMessage(
          nextMode === 'main'
            ? 'Loading main-sequence spectra…'
            : 'Loading red giant spectra…'
        );

        try {
          await setMode(nextMode);
          showMessage('');
        } catch (err) {
          console.error(err);
          showMessage('Could not load spectra for this mode.', true);

          // Revert title and mode on failure
          const revert = (nextMode === 'main') ? 'giants' : 'main';
          currentMode = revert;
          titleMain.textContent =
            revert === 'main'
              ? 'Star Spectra Viewer - Main Sequence'
              : 'Star Spectra Viewer - Red Giants';
        }
      });
    }

    async function init() {
      makeCanvasSizing();
      setupTitleToggle();

      showMessage('Loading main-sequence spectra…');
      await setMode('main'); // initial load from spectra.json
      showMessage('');

      slider.addEventListener('input', () => {
        const idx = parseInt(slider.value, 10);
        if (keys[idx]) loadSpectrum(keys[idx]);
      });
    }

    function makeCanvasSizing() {
      function resize() {
        canvas.width = Math.floor(canvas.clientWidth * devicePixelRatio);
        canvas.height = Math.floor(canvas.clientHeight * devicePixelRatio);
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        if (currentKey) {
          drawSpectrum(spectraData[currentKey]);
          drawSpectrumRainbow(spectraData[currentKey], document.getElementById('canvasRainbow'));
        }
      }
      window.addEventListener('resize', debounce(resize, 120));
      resize();
    }

    function getVisibleSpectrum(
      spectrum,
      visibleMin = 380,
      visibleMax = 780,
      maxPoints = 1800   // cap number of samples we ever draw
    ) {
      if (!spectrum || !spectrum.wavelength || !spectrum.flux) return null;

      const wl = spectrum.wavelength;
      const fx = spectrum.flux;
      if (wl.length !== fx.length || wl.length < 2) return null;

      // filter to visible range
      const visibleIndices = wl
        .map((w, i) => (w >= visibleMin && w <= visibleMax ? i : -1))
        .filter(i => i >= 0);
      if (visibleIndices.length < 2) return null;

      let wlVis = visibleIndices.map(i => wl[i]);
      let fxVis = visibleIndices.map(i => fx[i]);

      // extra downsampling for very dense spectra (giants templates, etc.)
      if (wlVis.length > maxPoints) {
        const stride = Math.ceil(wlVis.length / maxPoints);
        const wlDown = [];
        const fxDown = [];
        for (let i = 0; i < wlVis.length; i += stride) {
          wlDown.push(wlVis[i]);
          fxDown.push(fxVis[i]);
        }
        wlVis = wlDown;
        fxVis = fxDown;
      }

      const maxF = Math.max(...fxVis) || 1;

      return { wl: wlVis, fx: fxVis, maxF, minW: visibleMin, maxW: visibleMax };
    }

    function drawSpectrum(spectrum) {
      const visible = getVisibleSpectrum(spectrum);
      if (!visible) {
        showMessage('No data in visible spectrum range (380–780nm).', true);
        return;
      }

      const { wl, fx, maxF, minW, maxW } = visible;

      // canvas sizing
      const cw = canvas.clientWidth || 600;
      const ch = canvas.clientHeight || 400;
      canvas.width = Math.floor(cw * devicePixelRatio);
      canvas.height = Math.floor(ch * devicePixelRatio);
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      ctx.clearRect(0, 0, cw, ch);

      plotHeight = Math.max(0, ch - marginBottom - topPadding);
      const rainbowTop = topPadding;
      const rainbowBottom = topPadding + plotHeight;

      ctx.lineWidth = 1;
      ctx.lineCap = 'round';

      // draw spectrum as segments
      for (let i = 0; i < wl.length - 1; i++) {
        const x1 = ((wl[i] - minW) / (maxW - minW)) * cw;
        const x2 = ((wl[i + 1] - minW) / (maxW - minW)) * cw;
        const y1 = rainbowTop + (1 - fx[i] / maxF) * plotHeight;
        const y2 = rainbowTop + (1 - fx[i + 1] / maxF) * plotHeight;

        ctx.strokeStyle = wavelengthToRGBString(wl[i]);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      // title
      ctx.fillStyle = '#ddd';
      ctx.font = '12px system-ui, sans-serif';
      ctx.textBaseline = 'top';
      ctx.textAlign = 'left';
      ctx.fillText(`Spectral Type: ${currentKey} — ${minW}–${maxW}nm`, 8, 8);

      // wavelength scale
      drawWavelengthScale(minW, maxW, ctx, cw, ch, marginBottom);

      // persistent line
      if (persistentLineX !== null) {
        ctx.strokeStyle = "red";
        ctx.beginPath();
        ctx.moveTo(persistentLineX, rainbowTop);
        ctx.lineTo(persistentLineX, rainbowBottom);
        ctx.stroke();
      }

      // saved lines
      for (let x of savedLines) {
        ctx.strokeStyle = "red";
        ctx.beginPath();
        ctx.moveTo(x, rainbowTop);
        ctx.lineTo(x, rainbowBottom);
        ctx.stroke();
      }

      // --- hover measuring line and label (match Galaxy Viewer style) ---
      if (hoverLineX !== null && hoverLineX >= 0 && hoverLineX <= cw) {
        // Map x → wavelength (nm) across visible band
        const wavelength = minW + (hoverLineX / cw) * (maxW - minW);  // 380–780 nm

        // Same label formatting as Galaxy Viewer: "####.# nm"
        const label = `${wavelength.toFixed(1)} nm`;

        // Color at this wavelength (reuse your mapping)
        const rgb = wavelengthToRGBObj(wavelength);
        const col = `rgb(${rgb.r},${rgb.g},${rgb.b})`;

        ctx.save();

        // Colored vertical line with soft glow (like Galaxy Viewer)
        ctx.strokeStyle = col;
        ctx.lineWidth = 1;
        ctx.shadowColor = `rgba(${rgb.r},${rgb.g},${rgb.b},0.6)`;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.moveTo(hoverLineX, rainbowTop + 2);
        ctx.lineTo(hoverLineX, rainbowBottom);
        ctx.stroke();

        // Label Y position: follow cursor but stay inside the plot band
        const ly = Math.max(
          rainbowTop + 12,
          Math.min(rainbowBottom - 12, (hoverLineY ?? rainbowBottom) - 10)
        );

        // Text style: bold, centered on the line, with dark outline behind (Galaxy Viewer style)
        ctx.font = 'bold 14px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';

        // Dark outline for readability
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0,0,0,0.65)';
        ctx.strokeText(label, hoverLineX, ly);

        // Fill in spectral color
        ctx.fillStyle = col;
        ctx.fillText(label, hoverLineX, ly);

        ctx.restore();
      }

      // wavelength label for hover line, with glow in spectral color
    }



    function drawWavelengthScale(minW, maxW, ctx, cw, ch, marginBottom) {
      const range = Math.max(1e-6, maxW - minW);
      const axisBottom = ch - marginBottom + 2; // baseline for ticks
      const pixels = cw;

      function chooseMajorStep(range, pixels, minLabelSpacing = 60) {
        const targetLabels = Math.max(2, Math.floor(pixels / minLabelSpacing));
        const rough = range / targetLabels;
        const pow10 = Math.pow(10, Math.floor(Math.log10(rough)));
        const candidates = [1, 2, 5, 10];
        let best = candidates[0] * pow10;
        let bestDiff = Infinity;
        for (const c of candidates) {
          const step = c * pow10;
          const diff = Math.abs(step - rough);
          if (diff < bestDiff) { best = step; bestDiff = diff; }
        }
        return best;
      }

      const majorStep = chooseMajorStep(range, pixels, 60);
      const minorStep = majorStep / 10;

      ctx.save();
      ctx.strokeStyle = '#888';
      ctx.fillStyle = '#ddd';
      ctx.lineWidth = 1;
      ctx.font = '12px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';

      const worldToX = w => ((w - minW) / range) * cw;

      const pixelsPerMajor = (majorStep / range) * cw;
      const minPixelSpacing = 56;
      const labelSkip = Math.max(1, Math.ceil(minPixelSpacing / pixelsPerMajor));

      // --- Major ticks and label candidates ---
      const labelCandidates = [];
      let majorIndex = 0;
      const startMajor = Math.ceil(minW / majorStep) * majorStep;
      const endMajor = Math.floor(maxW / majorStep) * majorStep;

      for (let w = startMajor; w <= endMajor + 1e-9; w += majorStep) {
        const x = worldToX(w);
        // major tick
        ctx.beginPath();
        ctx.moveTo(x, axisBottom);
        ctx.lineTo(x, axisBottom - 10);
        ctx.stroke();

        if (majorIndex % labelSkip === 0) {
          labelCandidates.push({ w, x });
        }
        majorIndex++;
      }

      // --- Minor ticks ---
      const startMinor = Math.ceil(minW / minorStep) * minorStep;
      for (let w = startMinor; w <= maxW + 1e-9; w += minorStep) {
        if (Math.abs((w / majorStep) - Math.round(w / majorStep)) < 1e-6) continue;
        const x = worldToX(w);
        ctx.beginPath();
        ctx.moveTo(x, axisBottom);
        ctx.lineTo(x, axisBottom - 6);
        ctx.stroke();
      }

      // --- Numeric labels, with edge and overlap avoidance ---
      const EDGE_MARGIN = 6; // px from canvas edge
      const leftLimit = EDGE_MARGIN;
      const rightLimit = cw - EDGE_MARGIN;

      let lastRight = -Infinity;
      for (const lab of labelCandidates) {
        const text = String(Math.round(lab.w));
        const tw = ctx.measureText(text).width;
        const half = tw / 2;

        // Skip labels that would cross the left/right edges
        if (lab.x - half < leftLimit || lab.x + half > rightLimit) continue;

        // Skip labels that would collide with previous drawn label
        if (lab.x - half < lastRight + EDGE_MARGIN) continue;

        ctx.fillText(text, lab.x, axisBottom + 2);
        lastRight = lab.x + half;
      }

      // --- Axis unit label ---
      const unitLabel = 'Wavelength (nm)';
      ctx.font = '11px system-ui, sans-serif';
      const unitY = axisBottom + 20; // below tick numbers
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(unitLabel, cw / 2, unitY);

      ctx.restore();
    }

    function wavelengthToRGBString(wavelength) {
      let r = 0, g = 0, b = 0, factor = 0;
      if (wavelength >= 380 && wavelength < 440) { r = -(wavelength - 440) / (440 - 380); g = 0; b = 1; }
      else if (wavelength >= 440 && wavelength < 490) { r = 0; g = (wavelength - 440) / (490 - 440); b = 1; }
      else if (wavelength >= 490 && wavelength < 510) { r = 0; g = 1; b = -(wavelength - 510) / (510 - 490); }
      else if (wavelength >= 510 && wavelength < 580) { r = (wavelength - 510) / (580 - 510); g = 1; b = 0; }
      else if (wavelength >= 580 && wavelength < 645) { r = 1; g = -(wavelength - 645) / (645 - 580); b = 0; }
      else if (wavelength >= 645 && wavelength <= 780) { r = 1; g = 0; b = 0; }
      else { r = g = b = 0; }

      if (wavelength >= 380 && wavelength < 420) factor = 0.3 + 0.7 * (wavelength - 380) / 40;
      else if (wavelength >= 420 && wavelength <= 700) factor = 1.0;
      else if (wavelength > 700 && wavelength <= 780) factor = 0.3 + 0.7 * (780 - wavelength) / 80;
      else factor = 0.0;

      const gamma = 0.8;
      const R = Math.round(Math.pow(Math.max(0, r * factor), gamma) * 255 + 10);
      const G = Math.round(Math.pow(Math.max(0, g * factor), gamma) * 255 + 10);
      const B = Math.round(Math.pow(Math.max(0, b * factor), gamma) * 255 + 10);
      return `rgb(${R},${G},${B})`;
    }

    function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

    async function tryFetchJSON(path) {
      try {
        const res = await fetch(path, { cache: "no-cache" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return { path, json: await res.json() };
      } catch (err) {
        console.warn('fetch failed', path, err);
        return { path, error: err };
      }
    }

    function findIndexAtOrAbove(wlArr, target) {
      if (!wlArr || wlArr.length === 0) return 0;
      let lo = 0, hi = wlArr.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (wlArr[mid] < target) {
          lo = mid + 1;
        } else {
          hi = mid;
        }
      }
      return lo;
    }

    /**
     * DRAW RAINBOW into an offscreen buffer and paint the buffer to the visible canvas.
     * The offscreen buffer is stored on canvasRainbow._rainbowBuffer so magnifier can reuse it.
     */
    function drawSpectrumRainbow(spectrum, canvasRainbow) {
      const visible = getVisibleSpectrum(spectrum);
      if (!visible) return;

      const { wl, fx, maxF, minW, maxW } = visible;

      // CSS sizes
      const cw = Math.max(1, canvasRainbow.clientWidth);
      const ch = Math.max(1, canvasRainbow.clientHeight);

      const dpr = devicePixelRatio || 1;
      const bufW = Math.max(1, Math.floor(cw * dpr));
      const bufH = Math.max(1, Math.floor(ch * dpr));

      const buf = document.createElement('canvas');
      buf.width = bufW;
      buf.height = bufH;
      const bctx = buf.getContext('2d');
      bctx.clearRect(0, 0, bufW, bufH);

      for (let i = 0; i < bufW; i++) {
        const w = minW + (i / (bufW - 1)) * (maxW - minW);

        // use binary search instead of findIndex
        const idx = findIndexAtOrAbove(wl, w);
        const f = (fx[idx] || 0) / maxF;

        const rgb = wavelengthToRGBObj(w);
        let r = Math.round(Math.max(0, Math.min(255, rgb.r * f)));
        let g = Math.round(Math.max(0, Math.min(255, rgb.g * f)));
        let b = Math.round(Math.max(0, Math.min(255, rgb.b * f)));

        // fall back to gray if nearly neutral
        if (Math.abs(r - g) < 2 && Math.abs(g - b) < 2) {
          const gray = Math.min(255, Math.round(40 + 200 * f));
          r = g = b = gray;
        }

        bctx.fillStyle = `rgb(${r},${g},${b})`;
        bctx.fillRect(i, 0, 1, bufH);
      }

      canvasRainbow._rainbowBuffer = buf;

      const ctxR = canvasRainbow.getContext('2d');
      canvasRainbow.width = bufW;
      canvasRainbow.height = bufH;
      ctxR.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctxR.clearRect(0, 0, cw, ch);
      ctxR.drawImage(buf, 0, 0, bufW, bufH, 0, 0, cw, ch);
    }

    /**
     * Enable magnifier on a canvasRainbow element using the buffer produced by drawSpectrumRainbow.
     * Listeners are added once; subsequent calls update the stored buffer (so magnifier uses latest).
     */
    function enableMagnifier(canvasRainbow, spectrum) {
      if (!canvasRainbow) return;
      const ctxR = canvasRainbow.getContext('2d');
      const dpr = devicePixelRatio || 1;

      // Avoid adding listeners multiple times — mark the element
      if (!canvasRainbow._magnifierInstalled) {
        function drawMagnifierAt(clientX) {
          const rect = canvasRainbow.getBoundingClientRect();
          const cw = Math.max(1, canvasRainbow.clientWidth);
          const ch = Math.max(1, canvasRainbow.clientHeight);
          const xCSS = clientX - rect.left;
          if (xCSS < 0 || xCSS > cw) return;

          const buf = canvasRainbow._rainbowBuffer;
          if (!buf) return;

          // Draw in CSS coordinates
          ctxR.setTransform(dpr, 0, 0, dpr, 0, 0);

          // Redraw base rainbow
          ctxR.clearRect(0, 0, cw, ch);
          ctxR.drawImage(buf, 0, 0, buf.width, buf.height, 0, 0, cw, ch);

          // Vertical indicator on the rainbow itself
          ctxR.save();
          ctxR.globalAlpha = 0.9;
          ctxR.strokeStyle = 'rgba(255,80,0,0.9)';
          ctxR.lineWidth = 2;
          const indicatorX = xCSS;
          ctxR.beginPath();
          ctxR.moveTo(indicatorX, 0);
          ctxR.lineTo(indicatorX, ch);
          ctxR.stroke();
          ctxR.restore();

          // Magnifier geometry (responsive to rainbow size)
          const margin = 8;
          const magWidth = Math.min(cw * 0.45, 260);
          const magHeight = Math.min(ch * 0.8, 140);
          const zoom = 4;
          const magX = Math.min(cw - magWidth - margin, xCSS + 15);
          const magY = margin;

          const destW = magWidth;
          const destH = magHeight - 24; // image slice height

          // Dark background behind image area only (no extra white band)
          ctxR.fillStyle = "rgba(0, 0, 0, 0.85)";
          ctxR.fillRect(magX - 1, magY - 1, magWidth + 2, destH + 2);
          ctxR.strokeStyle = "#333";
          ctxR.lineWidth = 1;
          ctxR.strokeRect(magX - 1, magY - 1, magWidth + 2, destH + 2);

          // Source rectangle in buffer (device pixels)
          const centerBufX = (xCSS / cw) * buf.width;
          const srcWidthBuf = Math.max(1, Math.floor((magWidth / zoom) * dpr));
          let srcX = Math.round(centerBufX - srcWidthBuf / 2);
          srcX = Math.max(0, Math.min(buf.width - srcWidthBuf, srcX));
          const srcY = 0;
          const srcH = buf.height;

          // Draw high-res slice into magnifier
          ctxR.drawImage(buf, srcX, srcY, srcWidthBuf, srcH, magX, magY, destW, destH);

          // Tick mark inside magnifier (center)
          const tickX = magX + destW / 2;
          ctxR.strokeStyle = "black";
          ctxR.lineWidth = 1;
          ctxR.beginPath();
          ctxR.moveTo(tickX, magY);
          ctxR.lineTo(tickX, magY + destH);
          ctxR.stroke();

          // Visible spectrum for wavelength mapping
          const visible = getVisibleSpectrum(spectrum);
          if (!visible) return;

          const { minW, maxW } = visible; // 380–780 nm
          const centerWavelength = minW + (xCSS / cw) * (maxW - minW);

          // Label with tenths precision
          const text = `${centerWavelength.toFixed(1)} nm`;
          ctxR.font = "12px system-ui, sans-serif";
          const textMetrics = ctxR.measureText(text);
          const textWidth = textMetrics.width;
          const textHeight = 12;

          // Label background
          const labelX = magX + 6;
          const labelY = magY + destH - (textHeight + 6);
          ctxR.fillStyle = "rgba(50,50,50,0.75)";
          ctxR.fillRect(labelX, labelY, textWidth + 6, textHeight + 4);

          // Label text
          ctxR.fillStyle = "white";
          ctxR.textBaseline = "top";
          ctxR.fillText(text, labelX + 3, labelY + 2);

          // --- Update tracer on main spectrum canvas ---
          if (typeof plotHeight === "number" && plotHeight > 0 && currentKey && spectraData[currentKey]) {
            const specCW = canvas.clientWidth || canvas.width / (devicePixelRatio || 1);
            if (specCW > 0) {
              const specX = ((centerWavelength - minW) / (maxW - minW)) * specCW;
              const rainbowTop = topPadding;
              const rainbowBottom = topPadding + plotHeight;
              const specY = (rainbowTop + rainbowBottom) / 2;

              hoverLineX = specX;
              hoverLineY = specY;
              drawSpectrum(spectraData[currentKey]);
            }
          }
        }

        // pointer handlers: unify mouse & touch using clientX
        function onMovePointer(e) {
          let clientX;
          if (e.touches && e.touches.length) {
            const t = e.touches[0];
            clientX = t.clientX;
            e.preventDefault(); // stop page scroll while using magnifier
          } else {
            clientX = e.clientX;
          }
          drawMagnifierAt(clientX);
        }

        function onLeave() {
          // redraw base only (clear magnifier)
          const buf = canvasRainbow._rainbowBuffer;
          if (buf) {
            const cw = Math.max(1, canvasRainbow.clientWidth);
            const ch = Math.max(1, canvasRainbow.clientHeight);
            ctxR.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctxR.clearRect(0, 0, cw, ch);
            ctxR.drawImage(buf, 0, 0, buf.width, buf.height, 0, 0, cw, ch);
          } else {
            ctxR.clearRect(0, 0, canvasRainbow.clientWidth, canvasRainbow.clientHeight);
          }

          // clear tracer on main spectrum canvas when finger leaves
          hoverLineX = null;
          hoverLineY = null;
          if (currentKey && spectraData[currentKey]) {
            drawSpectrum(spectraData[currentKey]);
          }
        }

        canvasRainbow.addEventListener('mousemove', onMovePointer, { passive: true });
        canvasRainbow.addEventListener('touchstart', onMovePointer, { passive: false });
        canvasRainbow.addEventListener('touchmove', onMovePointer, { passive: false });
        canvasRainbow.addEventListener('mouseleave', onLeave);
        canvasRainbow.addEventListener('touchend', onLeave, { passive: true });
        canvasRainbow.addEventListener('touchcancel', onLeave, { passive: true });

        canvasRainbow._magnifierInstalled = true;
      }
    }

    function pickInitialIndexForMode(mode, keys) {
      // For main sequence, keep your old default if possible (27)
      if (mode === 'main') {
        return Math.min(27, Math.max(0, keys.length - 1));
      }
      // For giants, just pick the middle of the sequence
      return Math.floor(keys.length / 2);
    }

    async function loadSpectraForMode(mode) {
      const file = SPECTRA_FILES[mode] || SPECTRA_FILES.main;
      const result = await tryFetchJSON(file);

      if (!result || result.error) {
        throw new Error(`Could not load spectra from ${file}`);
      }

      spectraData = normalizeSpectra(result.json);
      keys = Object.keys(spectraData).sort(spectralComparator);

      if (keys.length === 0) {
        throw new Error(`JSON loaded from ${file} but no spectra found.`);
      }

      slider.max = keys.length - 1;
      const idx = pickInitialIndexForMode(mode, keys);
      slider.value = idx;
      sliderLabel.textContent = keys[idx];
      loadSpectrum(keys[idx]);

      // Cache this dataset so we can switch back instantly later
      spectraCache[mode] = {
        data: spectraData,
        keys: [...keys]
      };
    }

    async function setMode(mode) {
      if (mode === currentMode && spectraCache[mode]) return;
      currentMode = mode;

      const cached = spectraCache[mode];
      if (cached) {
        // Reuse already-loaded data
        spectraData = cached.data;
        keys = [...cached.keys];

        slider.max = keys.length - 1;
        const idx = pickInitialIndexForMode(mode, keys);
        slider.value = idx;
        sliderLabel.textContent = keys[idx];
        loadSpectrum(keys[idx]);
        return;
      }

      await loadSpectraForMode(mode);
    }

    function normalizeSpectra(raw) {
      const normalized = {};
      if (Array.isArray(raw)) {
        raw.forEach((entry, i) => normalized[String(i)] = entry);
      } else if (typeof raw === 'object') {
        for (const k in raw) normalized[k] = raw[k];
      }
      return normalized;
    }

    function spectralComparator(a, b) {
      const spectralOrder = ['L', 'T', 'M', 'K', 'G', 'F', 'A', 'B', 'O'];
      const matchA = a.match(/^([LTMKGFABO])(\d+)?/);
      const matchB = b.match(/^([LTMKGFABO])(\d+)?/);
      if (!matchA || !matchB) return 0;
      const idxA = spectralOrder.indexOf(matchA[1]);
      const idxB = spectralOrder.indexOf(matchB[1]);
      if (idxA !== idxB) return idxA - idxB;
      const nA = matchA[2] ? parseInt(matchA[2], 10) : 0;
      const nB = matchB[2] ? parseInt(matchB[2], 10) : 0;
      return nB - nA;
    }

    function loadSpectrum(key) {
      if (!spectraData[key]) return;
      currentKey = key;
      sliderLabel.textContent = key;
      drawSpectrum(spectraData[key]);
      drawSpectrumRainbow(spectraData[key], document.getElementById('canvasRainbow'));
      enableMagnifier(document.getElementById('canvasRainbow'), spectraData[key]);
    }

    function showMessage(txt, isErr = false) {
      messageEl.textContent = txt;
      messageEl.style.color = isErr ? 'var(--err)' : 'var(--muted)';
    }

    function wavelengthToRGBObj(wavelength) {
      let r = 0, g = 0, b = 0, factor = 0;

      if (wavelength >= 380 && wavelength < 440) { r = -(wavelength - 440) / (440 - 380); g = 0; b = 1; }
      else if (wavelength >= 440 && wavelength < 490) { r = 0; g = (wavelength - 440) / (490 - 440); b = 1; }
      else if (wavelength >= 490 && wavelength < 510) { r = 0; g = 1; b = -(wavelength - 510) / (510 - 490); }
      else if (wavelength >= 510 && wavelength < 580) { r = (wavelength - 510) / (580 - 510); g = 1; b = 0; }
      else if (wavelength >= 580 && wavelength < 645) { r = 1; g = -(wavelength - 645) / (645 - 580); b = 0; }
      else if (wavelength >= 645 && wavelength <= 780) { r = 1; g = 0; b = 0; }
      else { r = g = b = 0; }

      if (wavelength >= 380 && wavelength < 420) factor = 0.3 + 0.7 * (wavelength - 380) / 40;
      else if (wavelength >= 420 && wavelength <= 700) factor = 1.0;
      else if (wavelength > 700 && wavelength <= 780) factor = 0.3 + 0.7 * (780 - wavelength) / 80;
      else factor = 0.0;

      const gamma = 0.8;
      // compute, clamp, round
      const R = Math.round(Math.max(0, Math.min(255, Math.pow(Math.max(0, r * factor), gamma) * 255 + 10)));
      const G = Math.round(Math.max(0, Math.min(255, Math.pow(Math.max(0, g * factor), gamma) * 255 + 10)));
      const B = Math.round(Math.max(0, Math.min(255, Math.pow(Math.max(0, b * factor), gamma) * 255 + 10)));

      return { r: R, g: G, b: B };
    }

    function updateSpectrumHoverFromClientXY(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const mx = clientX - rect.left;
      const my = clientY - rect.top;

      const rainbowTop = topPadding;
      const rainbowBottom = topPadding + plotHeight;

      // Only show hover when pointer is inside the plotted spectrum band
      if (my >= rainbowTop && my <= rainbowBottom) {
        hoverLineX = mx;
        hoverLineY = my;
      } else {
        hoverLineX = null;
        hoverLineY = null;
      }

      if (currentKey && spectraData[currentKey]) {
        drawSpectrum(spectraData[currentKey]);
      }
    }

    canvas.addEventListener("mousemove", (e) => {
      updateSpectrumHoverFromClientXY(e.clientX, e.clientY);
    });

    // Clear hover when mouse leaves the spectrum
    canvas.addEventListener("mouseleave", () => {
      hoverLineX = null;
      hoverLineY = null;
      if (currentKey && spectraData[currentKey]) {
        drawSpectrum(spectraData[currentKey]);
      }
    });

    // TOUCH: press-and-hold hover on spectrum
    canvas.addEventListener("touchstart", (e) => {
      if (e.touches && e.touches.length) {
        e.preventDefault(); // prevent scrolling
        const t = e.touches[0];
        updateSpectrumHoverFromClientXY(t.clientX, t.clientY);
      }
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      if (e.touches && e.touches.length) {
        e.preventDefault(); // keep finger drag inside canvas, no page scroll
        const t = e.touches[0];
        updateSpectrumHoverFromClientXY(t.clientX, t.clientY);
      }
    }, { passive: false });

    canvas.addEventListener("touchend", () => {
      // lift finger: remove the hover tracer
      hoverLineX = null;
      hoverLineY = null;
      if (currentKey && spectraData[currentKey]) {
        drawSpectrum(spectraData[currentKey]);
      }
    }, { passive: true });

    canvas.addEventListener("touchcancel", () => {
      hoverLineX = null;
      hoverLineY = null;
      if (currentKey && spectraData[currentKey]) {
        drawSpectrum(spectraData[currentKey]);
      }
    }, { passive: true });

    canvas.addEventListener("click", () => {
      if (hoverLineX !== null) {
        persistentLineX = hoverLineX;
        savedLines.push(persistentLineX);
      }
    });

    document.getElementById("keepLineBtn").addEventListener("click", () => {
      if (persistentLineX !== null) {
        savedLines.push(persistentLineX);
      }
    });

    document.getElementById("clearLinesBtn").addEventListener("click", () => {
      savedLines = [];
      persistentLineX = null;
      drawSpectrum(spectraData[currentKey]);
    });

  </script>
</body>

</html>
